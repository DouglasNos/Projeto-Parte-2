<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8">
  <style>
    form 
    {
      font-weight: bold;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
    }
    div 
    {
      background-color: antiquewhite;
    }
    .class_input_name 
    {
      width: 300px;
    }
    .class_botao_enviar 
    {
      width: 100px;
      height: 30px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
<title>Agendamento</title>
</head> 
<body>
  <div>
    <form action=https://formsubmit.co/petshop@gmail.com method="POST">
      
      <fieldset>
        <legend>Agendamento</legend>
        <label>Escolha o serviço:</label>
        <br><br>
        <label>Banho</label>
        <input type="radio" value="banho"/>
        <label>Tosa</label>
        <input type="radio" value="tosa"/> 
        <br><br>
        <label>Escolha uma data e horário para a busca do pet:</label>
        <input type="datetime-local" name="agenda"/> 
      </fieldset>
      <br><br>
      <center>
      <label>Agendamento</label>
      <input class="class_botao_enviar" type="submit">
      </center>
      <br><br>
    </form>
  </div>
</body>
</html>
